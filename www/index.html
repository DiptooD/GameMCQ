<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Game MCQ</title>
  
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: gap: https://ssl.gstatic.com 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com;">
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <style>
    body { 
        margin:0; padding:0; background-color:#000; overflow: hidden; 
        height: 100vh; width: 100vw; touch-action: none; 
        -webkit-user-select: none; -webkit-touch-callout: none; user-select: none;
    }
    canvas { display: block; width: 100% !important; height: 100% !important; }
    #boot-screen {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background-color: #000; color: #00ffff; display: flex;
        justify-content: center; align-items: center; z-index: 99999;
        font-family: sans-serif; font-size: 18px; font-weight: bold;
    }
  </style>

  <script src="cordova.js"></script> 
</head>
<body>
  
  <div id="boot-screen">Connecting to Space...</div>

  <script>
    (async function bootApp() {
        const bootScreen = document.getElementById('boot-screen');
        let isOnline = false;
        
        // 1. Strict 3-Second Actual Connection Test
        if (navigator.onLine) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 3000); // 3 sec timeout
            try {
                // Ping a reliable small file (like the font stylesheet) to verify internet access
                await fetch('https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;600;700;800&display=swap', { 
                    method: 'HEAD', mode: 'no-cors', signal: controller.signal 
                });
                isOnline = true;
                clearTimeout(timeoutId);
            } catch(e) {
                console.log("Network test failed or timed out. Forcing Offline Mode.");
            }
        }
        window.isAppOnline = isOnline;

        // 2. Register Service Worker for Caching & Background Sync
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('ServiceWorker registered:', reg.scope))
                .catch(err => console.warn('ServiceWorker error:', err));
        }

        // 3. Load Fonts based on Connection Status
        const fontLink = document.createElement('link');
        fontLink.rel = 'stylesheet';
        fontLink.href = isOnline 
            ? 'https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;600;700;800&display=swap' 
            : 'css/local-fonts.css';
        document.head.appendChild(fontLink);

        // 4. Sequential Script Loader
        function loadScript(src) {
            return new Promise((resolve) => {
                const s = document.createElement('script');
                s.src = src;
                s.onload = resolve;
                s.onerror = () => {
                    console.warn('Failed to load: ' + src);
                    resolve(); // Resolve to prevent breaking the chain
                };
                document.body.appendChild(s);
            });
        }

        const phaserSrc = isOnline ? 'https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js' : 'js/phaser.min.js';
        
        await loadScript(phaserSrc);
        
        // Final fallback if CDN failed despite passing ping
        if (!window.Phaser && isOnline) {
            console.log("CDN failed, falling back to local Phaser...");
            await loadScript('js/phaser.min.js');
        }

        // Load all game scripts strictly in order
        const scripts = [
            "game.js",
            "scenes/LoadingScene.js",
            "scenes/PlayerProfileScene.js",
            "scenes/MenuScene.js",
            "scenes/SettingsScene.js",
            "scenes/ReadingScene.js",
            "scenes/ShopScene.js",
            "scenes/SpinWheelScene.js",
            "scenes/PlayerShipTextures.js",
            "scenes/GameTextures.js",
            "GameSFX.js",
            "scenes/GameBase.js",
            "scenes/GameScene.js",
            "scenes/QuestionScene.js",
            "scenes/PauseScene.js",
            "scenes/DeathScene.js",
            "main.js"
        ];

        for (let src of scripts) {
            await loadScript(src);
        }
        
        // Hide bootloader
        bootScreen.style.display = 'none';
    })();
  </script>
</body>
</html>
