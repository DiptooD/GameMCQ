<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Game MCQ</title>
  
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: gap: https://ssl.gstatic.com 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://www.gstatic.com https://apis.google.com; frame-src 'self' https://gamemcq.firebaseapp.com https://accounts.google.com; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com https://*.firebaseio.com https://*.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://raw.githubusercontent.com https://*.gstatic.com;">
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <style>
    body { 
        margin:0; padding:0; background-color:#000; overflow: hidden; 
        height: 100vh; width: 100vw; touch-action: none; 
        -webkit-user-select: none; -webkit-touch-callout: none; user-select: none;
    }
    canvas { display: block; width: 100% !important; height: 100% !important; }
    #boot-screen {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background-color: #000; color: #00ffff; display: flex;
        justify-content: center; align-items: center; z-index: 99999;
        font-family: sans-serif; font-size: 18px; font-weight: bold;
    }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithCredential, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCT-5xo5GAmbloUaYIweUm81QQvz8uWgGM",
      authDomain: "gamemcq.firebaseapp.com",
      projectId: "gamemcq",
      storageBucket: "gamemcq.firebasestorage.app",
      messagingSenderId: "1060690619330",
      appId: "1:1060690619330:web:a31cfeaf73a34aa904445b",
      measurementId: "G-XJTRXMQ8DZ"
    };

    const app = initializeApp(firebaseConfig);
    window.FirebaseAuth = getAuth(app);
    window.FirebaseAuth.useDeviceLanguage(); 
    window.FirebaseDB = getFirestore(app);
    
    window.FirebaseTools = { onAuthStateChanged, GoogleAuthProvider, signInWithCredential, signInWithPopup, doc, setDoc, getDoc, collection, query, orderBy, limit, getDocs };

    window.connectToCloud = function() {
        return new Promise((resolve) => {
            console.log("Checking Firebase Auth state...");
            
            if (!navigator.onLine) {
                console.log("No internet. Playing offline.");
                resolve();
                return;
            }

            window.FirebaseTools.onAuthStateChanged(window.FirebaseAuth, async (user) => {
                if (user) {
                    console.log("Player Logged In. ID:", user.uid);
                    const playerRef = window.FirebaseTools.doc(window.FirebaseDB, "players", user.uid);
                    try {
                        const saveFile = await window.FirebaseTools.getDoc(playerRef);
                        if (saveFile.exists()) {
                            console.log("Cloud save found! Syncing data to device...");
                            const cloudData = saveFile.data();
                            const gs = window.GameState || {};
                            
                            if (cloudData.keys !== undefined) gs.keys = cloudData.keys;
                            if (cloudData.debris !== undefined) gs.debris = cloudData.debris;
                            if (cloudData.equippedShip) gs.equippedShip = cloudData.equippedShip;
                            if (cloudData.ownedShips) gs.ownedShips = cloudData.ownedShips;
                            if (cloudData.equippedTheme) gs.equippedTheme = cloudData.equippedTheme;
                            if (cloudData.ownedThemes) gs.ownedThemes = cloudData.ownedThemes;
                            if (cloudData.boosters) gs.boosters = cloudData.boosters;
                            if (cloudData.rewardSkips !== undefined) gs.rewardSkips = cloudData.rewardSkips;
                            if (cloudData.gamesPlayed !== undefined) gs.gamesPlayed = cloudData.gamesPlayed;
                            if (cloudData.profile) gs.profile = cloudData.profile;
                            if (cloudData.matchHistory) gs.matchHistory = cloudData.matchHistory;
                            if (cloudData.dailyMissions) gs.dailyMissions = cloudData.dailyMissions;
                            if (cloudData.lastMissionDate) gs.lastMissionDate = cloudData.lastMissionDate;
                            if (cloudData.dailyMissionsCompleted !== undefined) gs.dailyMissionsCompleted = cloudData.dailyMissionsCompleted;

                            localStorage.setItem('game_keys', gs.keys);
                            localStorage.setItem('game_debris', gs.debris);
                            localStorage.setItem('game_profile', JSON.stringify(gs.profile));
                        }
                    } catch (error) {
                        console.error("Failed to load cloud save", error);
                    }
                } else {
                    console.log("No connected account found. Playing locally/offline.");
                }
                resolve(); 
            });
        });
    };

    window.signInWithGoogle = function() {
        return new Promise(async (resolve, reject) => {
            if (!navigator.onLine) {
                alert("Please connect to the internet to sign in.");
                return reject(new Error("Offline"));
            }

            try {
                if (window.cordova && window.plugins && window.plugins.googleplus) {
                    window.plugins.googleplus.login(
                        {
                            'webClientId': '1060690619330-cb5uqvur0e3c6p1290ie61j6n61nkrq7.apps.googleusercontent.com',
                            'offline': true
                        },
                        async function (obj) {
                            try {
                                const credential = window.FirebaseTools.GoogleAuthProvider.credential(obj.idToken);
                                const result = await window.FirebaseTools.signInWithCredential(window.FirebaseAuth, credential);
                                
                                console.log("Successfully logged in natively:", result.user.displayName);
                                await window.syncAfterLogin(result.user.uid);
                                
                                if (window.game && window.game.scene) {
                                    const activeScenes = window.game.scene.getScenes(true);
                                    activeScenes.forEach(s => s.scene.restart());
                                }
                                alert("Successfully connected to Cloud!");
                                resolve(result);
                            } catch (err) {
                                console.error("Firebase Auth initialization error:", err);
                                alert("Sign-in failed: " + err.message);
                                reject(err);
                            }
                        },
                        function (msg) {
                            console.error("Google Sign-In Error (Native):", msg);
                            alert("Sign-in failed: " + JSON.stringify(msg));
                            reject(new Error(JSON.stringify(msg)));
                        }
                    );
                } else {
                    const provider = new window.FirebaseTools.GoogleAuthProvider();
                    const result = await window.FirebaseTools.signInWithPopup(window.FirebaseAuth, provider);
                    
                    console.log("Successfully logged in with Google Web:", result.user.displayName);
                    await window.syncAfterLogin(result.user.uid);
                    
                    if (window.game && window.game.scene) {
                        const activeScenes = window.game.scene.getScenes(true);
                        activeScenes.forEach(s => s.scene.restart());
                    }
                    alert("Successfully connected to Cloud!");
                    resolve(result);
                }
            } catch(e) {
                console.error("Google Sign-In Error:", e);
                alert("Sign-in failed: " + e.message);
                reject(e);
            }
        });
    };

    window.syncAfterLogin = async function(uid) {
        const playerRef = window.FirebaseTools.doc(window.FirebaseDB, "players", uid);
        try {
            const saveFile = await window.FirebaseTools.getDoc(playerRef);
            if (saveFile.exists()) {
                const cloudData = saveFile.data();
                const gs = window.GameState;
                
                if (cloudData.keys !== undefined) gs.keys = cloudData.keys;
                if (cloudData.debris !== undefined) gs.debris = cloudData.debris;
                if (cloudData.profile) gs.profile = cloudData.profile;
                if (cloudData.equippedShip) gs.equippedShip = cloudData.equippedShip;
                if (cloudData.ownedShips) gs.ownedShips = cloudData.ownedShips;
                if (cloudData.gamesPlayed !== undefined) gs.gamesPlayed = cloudData.gamesPlayed;
                if (cloudData.matchHistory) gs.matchHistory = cloudData.matchHistory;
            }
            if (window.saveGame) window.saveGame();
        } catch (e) {
            console.error("Error syncing after login", e);
        }
    };
  </script>

  <script>
    if (window.cordova || navigator.userAgent.match(/(iPhone|iPod|iPad|Android|BlackBerry|IEMobile)/)) {
        var script = document.createElement('script');
        script.src = 'cordova.js';
        document.head.appendChild(script);
    }
  </script>

</head>
<body>
  
  <div id="boot-screen">Connecting to Space...</div>

  <script>
    (async function bootApp() {
        const bootScreen = document.getElementById('boot-screen');
        let isOnline = false;
        
        if (navigator.onLine) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 3000); 
            try {
                await fetch('https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;600;700;800&display=swap', { 
                    method: 'HEAD', mode: 'no-cors', signal: controller.signal 
                });
                isOnline = true;
                clearTimeout(timeoutId);
            } catch(e) {
                console.log("Network test failed or timed out. Forcing Offline Mode.");
            }
        }
        window.isAppOnline = isOnline;

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('ServiceWorker registered:', reg.scope))
                .catch(err => console.warn('ServiceWorker error:', err));
        }

        const fontLink = document.createElement('link');
        fontLink.rel = 'stylesheet';
        fontLink.href = isOnline 
            ? 'https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;600;700;800&display=swap' 
            : 'css/local-fonts.css';
        document.head.appendChild(fontLink);

        function loadScript(src) {
            return new Promise((resolve) => {
                const s = document.createElement('script');
                s.src = src;
                s.onload = resolve;
                s.onerror = () => {
                    console.warn('Failed to load: ' + src);
                    resolve(); 
                };
                document.body.appendChild(s);
            });
        }

        const phaserSrc = isOnline ? 'https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js' : 'js/phaser.min.js';
        await loadScript(phaserSrc);
        
        if (!window.Phaser && isOnline) {
            console.log("CDN failed, falling back to local Phaser...");
            await loadScript('js/phaser.min.js');
        }

        // FIX: Added scenes/ path to Leaderboard.js
        const scripts = [
            "game.js",
            "scenes/LoadingScene.js",
            "scenes/PlayerProfileScene.js",
            "scenes/Leaderboard.js", 
            "scenes/MenuScene.js",
            "scenes/SettingsScene.js",
            "scenes/ReadingScene.js",
            "scenes/ShopScene.js",
            "scenes/SpinWheelScene.js",
            "scenes/PlayerShipTextures.js",
            "scenes/GameTextures.js",
            "GameSFX.js",
            "scenes/GameBase.js",
            "scenes/GameScene.js",
            "scenes/QuestionScene.js",
            "scenes/PauseScene.js",
            "scenes/DeathScene.js",
            "scenes/InstructionScene.js",
            "main.js"
        ];

        for (let src of scripts) {
            await loadScript(src);
        }
        
        bootScreen.style.display = 'none';
    })();
  </script>
</body>
</html>
