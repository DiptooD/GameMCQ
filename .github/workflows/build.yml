name: Build Release Android App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Recreates your google-services.json securely before Cordova needs it
      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_BASE64 }}" | base64 --decode > google-services.json

      - name: Initialize NPM and Cordova
        run: |
          npm init -y
          npm install -g cordova
          cordova telemetry off

      - name: Add Android Platform
        run: cordova platform add android

      # Recreates your Keystore file secretly
      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > my-release-key.keystore

      # --- STEP 1: BUILD THE APK (For your Redmi Note 5 Pro) ---
      - name: Build and Sign Release APK
        run: |
          cordova build android --release -- --packageType=apk \
          --keystore=my-release-key.keystore \
          --alias='${{ secrets.KEY_ALIAS }}' \
          --storePassword='${{ secrets.KEY_PASSWORD }}' \
          --password='${{ secrets.KEY_PASSWORD }}'

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: game-mcq-release-apk
          path: platforms/android/app/build/outputs/apk/release/*.apk

      # --- STEP 2: BUILD THE AAB (For Google Play Store) ---
      - name: Build and Sign Release AAB
        run: |
          cordova build android --release -- --packageType=bundle \
          --keystore=my-release-key.keystore \
          --alias='${{ secrets.KEY_ALIAS }}' \
          --storePassword='${{ secrets.KEY_PASSWORD }}' \
          --password='${{ secrets.KEY_PASSWORD }}'

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: game-mcq-release-aab
          path: platforms/android/app/build/outputs/bundle/release/*.aab