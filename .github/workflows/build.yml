name: Build Release Android App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Initialize NPM
        run: npm init -y

      - name: Install Cordova
        run: npm install -g cordova

      - name: Add Android Platform
        run: cordova platform add android

      # This step creates a real keystore file on the server using your secret text
      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > my-release-key.keystore

      # Builds the AAB and signs it automatically using your passwords
      - name: Build and Sign Release AAB
        run: |
          cordova build android --release -- --packageType=bundle \
          --keystore=my-release-key.keystore \
          --alias=${{ secrets.KEY_ALIAS }} \
          --storePassword=${{ secrets.KEY_PASSWORD }} \
          --password=${{ secrets.KEY_PASSWORD }}

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: game-mcq-release-aab
          path: platforms/android/app/build/outputs/bundle/release/*.aab
